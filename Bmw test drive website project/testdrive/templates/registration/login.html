{% extends "testdrive/base.html" %}

{% block title %}BMW Test Drive | Log In{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Log in to book your next BMW test drive.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {{ form.as_p }}
            <button type="submit">Log In</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
    </div>
</div>
{% endblock %}
