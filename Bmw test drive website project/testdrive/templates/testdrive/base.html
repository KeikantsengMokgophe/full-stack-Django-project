<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BMW Test Drive{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #111;
        }

        nav {
            background-color: #000;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #0066b3;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            padding: 60px 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .hero {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
                url("/static/images/m3-competition.jpg") center/cover no-repeat;
            color: white;
        }

        .hero-content {
            max-width: 700px;
        }

        .hero h1 {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .hero-button {
            display: inline-block;
            background-color: #0066b3;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .hero-button:hover {
            background-color: #004f8a;
        }

        .why-section {
            padding: 70px 50px;
            text-align: center;
            background-color: #ffffff;
        }

        .why-section h2 {
            font-size: 36px;
            margin-bottom: 40px;
        }

        .why-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .why-card {
            padding: 30px;
            background-color: #f4f4f4;
            border-radius: 10px;
        }

        .why-card h3 {
            margin-bottom: 15px;
            font-size: 22px;
        }

        .why-card p {
            line-height: 1.6;
            color: #555;
        }

        .cta-section {
            padding: 70px 50px;
            text-align: center;
            background-color: #111;
            color: white;
        }

        .cta-section h2 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .cta-section p {
            font-size: 18px;
            margin-bottom: 30px;
        }


        .vehicles-intro {
            max-width: 700px;
            margin-top: 15px;
            line-height: 1.6;
            color: #555;
        }

        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .vehicle-card {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }

        .vehicle-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .vehicle-image {
            height: 250px;
            background-color: #e5e5e5;
            overflow: hidden;
        }

        .vehicle-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .vehicle-card:hover .vehicle-image img {
            transform: scale(1.05);
        }

        .no-image {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }

        .vehicle-info {
            padding: 25px;
        }

        .vehicle-info h2 {
            margin-bottom: 15px;
        }

        .vehicle-info p {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .availability {
            display: inline-block;
            margin-bottom: 20px;
            padding: 6px 12px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .availability.unavailable {
            background-color: #ffebee;
            color: #c62828;
        }

        .book-button {
            display: inline-block;
            background-color: #0066b3;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .book-button:hover {
            background-color: #004f8a;
        }

        .booking-form {
            max-width: 650px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.12);
        }

        .booking-form h1 {
            margin-bottom: 15px;
            font-size: 32px;
        }

        .booking-form p {
            margin-bottom: 20px;
        }

        .booking-form form p {
            margin-bottom: 15px;
        }

        .booking-form label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .booking-form input,
        .booking-form select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: 0.2s;
        }

        .booking-form input:focus,
        .booking-form select:focus {
            outline: none;
            border-color: #0066b3;
            box-shadow: 0 0 0 2px rgba(0, 102, 179, 0.1);
        }

        .booking-form button {
            width: 100%;
            padding: 14px;
            background-color: #0066b3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .booking-form button:hover {
            background-color: #004f8a;
        }

        .booking-form button:hover {
            background-color: #333;
        }

        .success-page {
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .success-card {
            max-width: 600px;
            width: 100%;
            padding: 50px;
            background-color: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.12);
        }

        .success-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 50%;
            font-size: 40px;
            font-weight: bold;
        }

        .success-card h1 {
            margin-bottom: 15px;
            font-size: 32px;
        }

        .success-card p {
            margin-bottom: 30px;
            line-height: 1.6;
            color: #555;
        }

        .success-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .secondary-button {
            display: inline-block;
            background-color: #e5e5e5;
            color: #111;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        .secondary-button:hover {
            background-color: #ccc;
        }

        footer {
            background-color: #000;
            color: #aaa;
            text-align: center;
            padding: 25px;
            font-size: 14px;
        }

        /* ===== BMW M Dark Auth Theme ===== */

        .auth-page {
            min-height: calc(100vh - 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: radial-gradient(circle at top, #16191f 0%, #000000 70%);
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: #0d0f13;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #0066b3 0%, #0066b3 33%, #6f2f81 33%, #6f2f81 66%, #e7222e 66%, #e7222e 100%);
        }

        .auth-card h1 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .auth-card .auth-subtitle {
            color: #8a8f98;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-card form p {
            margin-bottom: 18px;
        }

        .auth-card label {
            display: block;
            margin-bottom: 6px;
            color: #b8bcc4;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .auth-card input,
        .auth-card select {
            width: 100%;
            padding: 13px 14px;
            background-color: #1a1d23;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 15px;
            color: #ffffff;
            transition: 0.2s;
        }

        .auth-card input:focus,
        .auth-card select:focus {
            outline: none;
            border-color: #0066b3;
            box-shadow: 0 0 0 3px rgba(0, 102, 179, 0.25);
        }

        .auth-card input::placeholder {
            color: #5c6068;
        }

        .auth-card button[type="submit"] {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(90deg, #0066b3, #004f8a);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .auth-card button[type="submit"]:hover {
            background: linear-gradient(90deg, #0077cc, #0066b3);
            box-shadow: 0 6px 20px rgba(0, 102, 179, 0.4);
        }

        .auth-card .auth-switch {
            margin-top: 25px;
            text-align: center;
            color: #8a8f98;
            font-size: 14px;
        }

        .auth-card .auth-switch a {
            color: #4da3e0;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-card .auth-switch a:hover {
            text-decoration: underline;
        }

        .auth-card ul.errorlist {
            list-style: none;
            background: rgba(231, 34, 46, 0.12);
            border: 1px solid rgba(231, 34, 46, 0.35);
            color: #ff8a8a;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        /* Dark bookings page */

        .dark-section {
            min-height: calc(100vh - 140px);
            background: radial-gradient(circle at top, #16191f 0%, #000000 70%);
            padding: 60px 50px;
        }

        .dark-section h1 {
            color: #ffffff;
            margin-bottom: 30px;
        }

        .dark-section .vehicle-card {
            background-color: #0d0f13;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #dcdfe4;
        }

        .dark-section .vehicle-info h2 {
            color: #ffffff;
        }

        .dark-section .vehicle-info p {
            color: #b8bcc4;
        }

        .dark-section .vehicle-info strong {
            color: #ffffff;
        }

        .dark-section .empty-state {
            color: #8a8f98;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {

            nav {
                padding: 18px 20px;
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin-left: 10px;
                margin-right: 10px;
            }

            .container {
                padding: 40px 20px;
            }

            .hero {
                min-height: 450px;
                padding: 40px 20px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .hero p {
                font-size: 17px;
            }

            .why-grid {
                grid-template-columns: 1fr;
            }

            .why-section {
                padding: 50px 20px;
            }

            .cta-section {
                padding: 50px 20px;
            }

            .booking-form {
                margin: 40px 20px;
                padding: 30px 20px;
            }

            .success-card {
                padding: 35px 20px;
            }

        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">BMW</div>

        <div>
            <a href="/">Home</a>
            <a href="{% url 'vehicles' %}">Vehicles</a>
            <a href="{% url 'book_test_drive' %}">Book a Test Drive</a>

            {% if user.is_authenticated %}
            <a href="{% url 'my_bookings' %}">My Bookings</a>
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit"
                    style="background:none; border:none; color:white; cursor:pointer; font-size:inherit; margin-left:25px;">Logout</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">Log In</a>
            <a href="{% url 'register' %}">Sign Up</a>
            {% endif %}
        </div>
    </nav>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>© 2026 BMW Test Drive. Portfolio Project.</p>
    </footer>

</body>

</html>
